name: Toolkit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflows with actionlint
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint .github/workflows/*.yml repo-template/.github/workflows/*.yml
          rm -f actionlint actionlint_1.7.12_linux_amd64.tar.gz

      - name: Validate YAML and JSON syntax
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pyyaml
          python - <<'EOF'
          import json, pathlib, sys, yaml

          yaml_files = [
              *pathlib.Path(".github").rglob("*.yml"),
              *pathlib.Path("repo-template").rglob("*.yml"),
              *pathlib.Path("repo-template").rglob("*.yaml"),
              *pathlib.Path("stack-templates").rglob("*.yaml"),
          ]
          for path in sorted(set(yaml_files)):
              with path.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"OK YAML: {path}")

          for path in sorted(pathlib.Path("stack-templates").rglob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"OK JSON: {path}")
          EOF

      - name: Validate PowerShell scripts (syntax + PSScriptAnalyzer)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $errors = @()
          foreach ($file in Get-ChildItem scripts/*.ps1) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $errors += $parseErrors
              }
              $findings = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Error
              if ($findings) {
                  $findings | Format-Table -AutoSize
                  $errors += $findings
              }
              Write-Host "OK PS1: $($file.Name)"
          }
          if ($errors.Count -gt 0) {
              throw "PowerShell validation failed with $($errors.Count) error(s)."
          }

      - name: Verify no leaked secrets or broken doc footers
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "::error::.env must never be committed!"
            exit 1
          fi
          for f in AGENTS.md README.md guidelines/*.md repo-template/*.md repo-template/docs/*.md; do
            if ! grep -q "hi@tanisheesh.in" "$f"; then
              echo "::error::Missing author footer in $f"
              exit 1
            fi
          done
          echo "All template and footer checks passed."

