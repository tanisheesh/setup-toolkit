# ╔══════════════════════════════════════════════════════════════════════╗
# ║  TANISH'S SETUP TOOLKIT · tanisheesh.in                              ║
# ║  CI workflow. Goes to: <repo>/.github/workflows/ci.yml               ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Works as-is: it auto-detects the stack in each folder listed in CI_DIRS.
#   Node / Bun   → installs with the right package manager (from the lockfile),
#                  then runs lint, format:check, typecheck, build, test, and
#                  Playwright E2E tests (when playwright.config.* exists)
#   Python       → installs from uv.lock / pyproject.toml / requirements.txt,
#                  byte-compiles everything, runs ruff / mypy / pytest if present
#
# The only things you may need to edit:
#   1. CI_DIRS:  space-separated folders to check, e.g. ". backend frontend"
#   2. env:      dummy values for env vars your build reads at build time
#
# Keep workflow name `CI` and job name `ci` — dependabot-auto-merge.yml
# and branch rulesets depend on them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DIRS: "."
  NODE_DEFAULT_VERSION: "22"
  PYTHON_DEFAULT_VERSION: "3.12"
  RUN_E2E: "true"
  # Build-time env vars: add placeholders here if the build needs them, e.g.
  # DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  # NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  # SKIP_ENV_VALIDATION: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Detect stacks
        id: detect
        run: |
          node=false; bun=false; pnpm=false; python=false; e2e=false
          node_version="$NODE_DEFAULT_VERSION"
          python_version="$PYTHON_DEFAULT_VERSION"

          for d in $CI_DIRS; do
            [ -d "$d" ] || { echo "::error::CI_DIRS entry '$d' does not exist."; exit 1; }
            [ -f "$d/package.json" ] && node=true
            { [ -f "$d/bun.lockb" ] || [ -f "$d/bun.lock" ]; } && bun=true
            [ -f "$d/pnpm-lock.yaml" ] && pnpm=true
            { [ -f "$d/pyproject.toml" ] || [ -f "$d/requirements.txt" ] || [ -f "$d/setup.py" ]; } && python=true
            for cfg in playwright.config.ts playwright.config.js playwright.config.mjs playwright.config.mts; do
              [ -f "$d/$cfg" ] && e2e=true
            done
            for f in "$d/.nvmrc" "$d/.node-version"; do
              [ -f "$f" ] && node_version="$(tr -d 'v \r\n' < "$f")"
            done
            [ -f "$d/.python-version" ] && python_version="$(tr -d ' \r\n' < "$d/.python-version")"
          done

          {
            echo "node=$node"; echo "bun=$bun"; echo "pnpm=$pnpm"; echo "python=$python"; echo "e2e=$e2e"
            echo "node_version=$node_version"; echo "python_version=$python_version"
          } >> "$GITHUB_OUTPUT"
          echo "Detected → node=$node bun=$bun pnpm=$pnpm python=$python e2e=$e2e"

      - if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.detect.outputs.node_version }}

      - if: steps.detect.outputs.bun == 'true'
        uses: oven-sh/setup-bun@v2

      - if: steps.detect.outputs.pnpm == 'true'
        run: corepack enable

      - if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.detect.outputs.python_version }}

      - name: Install, lint, typecheck, build, test
        run: |
          set -euo pipefail

          has_script() {  # does package.json define a real (non-placeholder) script?
            node -e '
              const s = (require("./package.json").scripts || {})[process.argv[1]];
              process.exit(s && !/no test specified/.test(s) ? 0 : 1);
            ' "$1"
          }

          run_node() {
            if   [ -f bun.lockb ] || [ -f bun.lock ]; then pm=bun;  bun install --frozen-lockfile
            elif [ -f pnpm-lock.yaml ];               then pm=pnpm; pnpm install --frozen-lockfile
            elif [ -f yarn.lock ];                    then pm=yarn; yarn install --frozen-lockfile
            elif [ -f package-lock.json ];            then pm=npm;  npm ci
            else                                           pm=npm;  npm install
            fi

            for s in lint format:check typecheck type-check build test; do
              if has_script "$s"; then
                echo "::group::$pm run $s"; $pm run "$s"; echo "::endgroup::"
              fi
            done

            if [ "$RUN_E2E" = "true" ]; then
              for cfg in playwright.config.ts playwright.config.js playwright.config.mjs playwright.config.mts; do
                if [ -f "$cfg" ]; then
                  echo "::group::Playwright E2E ($cfg)"
                  npx playwright install --with-deps
                  if has_script "test:e2e"; then
                    $pm run test:e2e
                  else
                    npx playwright test
                  fi
                  echo "::endgroup::"
                  break
                fi
              done
            fi
          }

          run_python() {
            PY=""
            python -m pip install --upgrade pip
            if [ -f uv.lock ]; then
              pip install uv
              uv sync --all-extras
              PY="uv run --no-sync"
              if [ -f requirements-dev.txt ]; then uv pip install -r requirements-dev.txt; fi
            else
              if [ -f pyproject.toml ]; then
                pip install -e ".[dev]" || pip install -e .
              elif [ -f requirements.txt ]; then
                pip install -r requirements.txt
              fi
              if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
            fi

            echo "::group::compile check"
            $PY python -m compileall -q -x '(\.venv|venv|node_modules|\.git)/' .
            echo "::endgroup::"

            run_py_tool() {
              tool="$1"; shift
              if [ -n "$PY" ]; then
                $PY "$tool" --version >/dev/null 2>&1 || uv pip install "$tool"
                $PY "$tool" "$@"
              else
                command -v "$tool" >/dev/null 2>&1 || pip install "$tool"
                "$tool" "$@"
              fi
            }

            if [ -f ruff.toml ] || [ -f .ruff.toml ] || { [ -f pyproject.toml ] && grep -qs '\[tool\.ruff' pyproject.toml; }; then
              echo "::group::ruff"; run_py_tool ruff check .; echo "::endgroup::"
            fi

            if [ -f pyproject.toml ] && grep -qs '\[tool\.mypy' pyproject.toml; then
              echo "::group::mypy"; run_py_tool mypy .; echo "::endgroup::"
            fi

            if [ -d tests ] || [ -n "$(find . -maxdepth 3 -name 'test_*.py' -not -path './.venv/*' -not -path './venv/*' -print -quit)" ]; then
              echo "::group::pytest"
              if [ -n "$PY" ]; then
                $PY python -m pytest --version >/dev/null 2>&1 || uv pip install pytest
                $PY python -m pytest -q
              else
                python -m pytest --version >/dev/null 2>&1 || pip install pytest
                python -m pytest -q
              fi
              echo "::endgroup::"
            fi
          }

          for d in $CI_DIRS; do
            echo "━━━ $d ━━━"
            ( cd "$d"
              ran=false
              if [ -f package.json ]; then run_node; ran=true; fi
              if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then run_python; ran=true; fi
              if [ "$ran" = false ]; then echo "No Node or Python project found in '$d', skipping."; fi
            )
          done

      - name: Upload Playwright report on failure
        if: failure() && steps.detect.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: "**/playwright-report/"
          if-no-files-found: ignore
          retention-days: 7

